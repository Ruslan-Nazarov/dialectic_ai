name: Offline tests and evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  current:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,research]" -c requirements-audit.txt
      - run: python -m pytest tests/ experiments/grounding_vs_calibration/tests/ -q
      - run: python tools/audit_evidence.py --check --bootstrap
      - run: python -m pip wheel . --no-deps --wheel-dir dist

  archived-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./engine_v2[dev,dashboard]" openai
      - run: python -m pytest -q
        working-directory: engine_v2
