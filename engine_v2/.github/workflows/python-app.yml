name: DialecticAI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Daily, opt-in real-provider canary run (see the `canary` job below).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install the package itself (exercises the packaging path)
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Install test dependencies
      run: |
        pip install pytest pytest-asyncio

    - name: Run Core Tests (Zero-Dependencies mode)
      run: |
        pytest

    - name: Run Full Tests (with Optional Dependencies)
      run: |
        pip install mcp fastapi uvicorn json_repair
        pytest

    - name: Lint (ruff)
      # Non-blocking for now: this was wired up before the existing lint debt
      # (142 findings as of 2026-09-15, see development_log.md) was triaged.
      # Flip this to blocking once that debt is worked down.
      continue-on-error: true
      run: |
        pip install ruff
        ruff check .

    - name: Type check (mypy)
      # Non-blocking for now, same reasoning as ruff above (64 findings as of
      # 2026-09-15) -- see development_log.md.
      continue-on-error: true
      run: |
        pip install mypy
        mypy dialectic_ai

  canary:
    # Opt-in, real-API smoke test against a live GigaChat credential. Does NOT
    # run on every push/PR (real API calls cost quota and money); only on the
    # daily schedule above and on manual dispatch, so a provider-behavior
    # regression (like the list[str]-vs-str type-classification bug found
    # this session) is caught within a day instead of only during the next
    # manual benchmark run. Requires a GIGACHAT_AUTH_KEY repository secret --
    # skips itself (via the real-provider test's own skip condition) if unset.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install the package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio

    - name: Run real-provider canary test
      env:
        DIALECTIC_RUN_CANARY: "1"
        GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      run: |
        pytest tests/test_canary_real_provider.py -v
