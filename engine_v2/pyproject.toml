[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dialectic-ai"
version = "0.1.0"
description = "An architectural framework for building predictable, dialectical Multi-Agent systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "DialecticAI Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.18.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]
langchain = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/Ruslan-Nazarov/dialectic_ai"

[project.scripts]
dialectic = "dialectic_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["dialectic_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: opt-in runs against real LLM providers (DIALECTIC_RUN_LIVE=1)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
