[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialectic-world"
version = "0.4.1"
description = "Experimental six-stage domain representations and reasoning verification for existing LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "python-dotenv"]
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/Ruslan-Nazarov/dialectic_ai"
Documentation = "https://github.com/Ruslan-Nazarov/dialectic_ai/blob/main/docs/ARCHITECTURE.md"

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
gigachat = ["httpx>=0.27"]
dev = ["pytest", "pytest-asyncio"]
research = ["scipy"]

[tool.setuptools.packages.find]
include = ["dialectic_world*"]

[tool.setuptools.package-data]
dialectic_world = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
